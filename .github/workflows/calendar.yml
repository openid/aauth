name: Meeting calendar

# Builds the AAuth WG calendar feed from the OpenID Foundation calendar,
# publishes it with a subscribe page to GitHub Pages, and keeps the
# next-meeting block in README.md current. See tools/build-calendar.py.
#
# Requires Settings > Pages > Build and deployment > Source: GitHub Actions.

on:
  schedule:
    - cron: '17 * * * *'   # hourly; off the top of the hour, when runners are busiest
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/build-calendar.py'
      - 'tools/requirements.txt'
      - '.github/workflows/calendar.yml'

permissions:
  contents: read

# One run at a time, so README commits and Pages deployments don't race.
concurrency:
  group: calendar
  cancel-in-progress: false

jobs:
  build:
    name: Build calendar and update README
    runs-on: ubuntu-latest
    permissions:
      contents: write   # commit the README next-meeting block
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install dependencies
        run: pip install -r tools/requirements.txt

      # Exits non-zero if the OIDF calendar can't be fetched or has no AAuth
      # events. The job then stops, so the last good feed stays published.
      - name: Build calendar
        run: python tools/build-calendar.py --out _site --readme README.md

      - name: Commit README if the next meeting changed
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update next meeting" README.md
          for _ in 1 2 3; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
